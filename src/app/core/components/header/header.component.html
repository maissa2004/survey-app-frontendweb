<!-- src/app/core/components/header/header.component.html -->

<nav class="navbar navbar-expand-lg bg-navy fixed-top" *ngIf="isBrowser && authService.isAuthenticated()">
  <div class="container">
    <a class="navbar-brand text-white fw-bold" [routerLink]="getHomeLink()">
      <i class="bi bi-file-earmark-text-fill text-orange me-2"></i>
      SurveyManager
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        
        <!-- 🔥 SUPER ADMIN - Gestion des users UNIQUEMENT -->
        <li class="nav-item" *ngIf="authService.isSuperAdmin()">
          <a class="nav-link text-white" routerLink="/user-management" routerLinkActive="active">
            <i class="bi bi-people-fill me-1"></i> Gestion Utilisateurs
          </a>
        </li>
        
        <!-- 🔥 ADMIN NORMAL (uniquement, pas le super admin) -->
        <ng-container *ngIf="authService.isNormalAdmin()">
          <li class="nav-item">
            <a class="nav-link text-white" routerLink="/dashboard" routerLinkActive="active">
              <i class="bi bi-speedometer2"></i> Tableau de bord
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" routerLink="/surveys" routerLinkActive="active">
              <i class="bi bi-files me-1"></i> Enquêtes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" routerLink="/sessions" routerLinkActive="active">
              <i class="bi bi-calendar-event me-1"></i> Sessions
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" routerLink="/submissions" routerLinkActive="active">
              <i class="bi bi-envelope-paper me-1"></i> Réponses des enquêtes
            </a>
          </li>
        </ng-container>
        
        <!-- ============================================ -->
        <!-- MENU DROPDOWN UTILISATEUR                    -->
        <!-- ============================================ -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i> {{ (authService.getCurrentUser()?.username) || 'User' }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" (click)="logout()" style="cursor: pointer;">
              <i class="bi bi-box-arrow-right me-1"></i> Déconnexion
            </a>
          </li>
          </ul>
        </li>

        <!-- ============================================ -->
        <!-- NOTIFICATION DROPDOWN (UNIQUEMENT POUR ADMINS) -->
        <!-- ============================================ -->
        <app-notification-dropdown></app-notification-dropdown>

        <!-- ============================================ -->
        <!-- BOUTON DARK MODE                             -->
        <!-- ============================================ -->
        <li class="nav-item">
          <button class="btn btn-link text-white" (click)="toggleDarkMode()" style="background: none; border: none;">
            <i class="bi" [class.bi-moon-fill]="!(themeService.getCurrentMode())" [class.bi-sun-fill]="themeService.getCurrentMode()"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div style="padding-top: 70px;" *ngIf="isBrowser && authService.isAuthenticated()"></div>
